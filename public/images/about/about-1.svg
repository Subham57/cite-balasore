<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" fill="none"> <defs> <!-- Main brand gradient --> <linearGradient id="bg" x1="80" y1="40" x2="720" y2="520" gradientUnits="userSpaceOnUse"> <stop offset="0" stop-color="#0A4291"/> <stop offset="0.55" stop-color="#0D5AB8"/> <stop offset="1" stop-color="#062F63"/> </linearGradient> <!-- Screen gradient --> <linearGradient id="screen" x1="280" y1="130" x2="610" y2="380" gradientUnits="userSpaceOnUse"> <stop stop-color="#123F78"/> <stop offset="1" stop-color="#061F42"/> </linearGradient> <!-- Blue glow --> <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(620 120) rotate(130) scale(250 250)"> <stop stop-color="#5FA8FF" stop-opacity="0.38"/> <stop offset="1" stop-color="#5FA8FF" stop-opacity="0"/> </radialGradient> <!-- White glass --> <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"> <stop stop-color="#FFFFFF" stop-opacity="0.18"/> <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/> </linearGradient> <!-- Shadow --> <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"> <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#031B3A" flood-opacity="0.35"/> </filter> <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"> <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#031B3A" flood-opacity="0.28"/> </filter> <!-- Clip for screen --> <clipPath id="screenClip"> <rect x="226" y="112" width="370" height="250" rx="18"/> </clipPath> </defs> <!-- Background --> <rect width="800" height="560" rx="0" fill="url(#bg)"/> <!-- Ambient glow --> <circle cx="620" cy="120" r="250" fill="url(#glow)"/> <!-- Decorative dots --> <g opacity="0.45" fill="#FFFFFF"> <circle cx="76" cy="92" r="3"/> <circle cx="100" cy="92" r="3"/> <circle cx="124" cy="92" r="3"/> <circle cx="700" cy="455" r="3"/> <circle cx="724" cy="455" r="3"/> <circle cx="748" cy="455" r="3"/> </g> <!-- Outer glass panel --> <rect x="48" y="48" width="704" height="464" rx="32" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" /> <!-- Small top label --> <g filter="url(#softShadow)"> <rect x="82" y="82" width="174" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.22"/> <circle cx="106" cy="103" r="7" fill="#55D6C2"/> <text x="122" y="108" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" > PRACTICAL LEARNING </text> </g> <!-- Floating code card --> <g filter="url(#softShadow)"> <rect x="82" y="166" width="190" height="142" rx="20" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.2"/> <!-- Window dots --> <circle cx="106" cy="190" r="5" fill="#FF6B6B"/> <circle cx="123" cy="190" r="5" fill="#FFD166"/> <circle cx="140" cy="190" r="5" fill="#55D6C2"/> <!-- Code --> <text x="106" y="224" font-family="monospace" font-size="15" font-weight="600" fill="#8CC5FF">&lt;/&gt;</text> <rect x="106" y="244" width="110" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.55"/> <rect x="106" y="261" width="78" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.30"/> <rect x="106" y="278" width="94" height="7" rx="3.5" fill="#55D6C2" fill-opacity="0.75"/> </g> <!-- Main laptop/dashboard --> <g filter="url(#shadow)"> <!-- Laptop screen --> <rect x="210" y="96" width="402" height="290" rx="25" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/> <!-- Inner screen --> <rect x="226" y="112" width="370" height="250" rx="18" fill="url(#screen)"/> <!-- Dashboard content --> <g clip-path="url(#screenClip)"> <!-- Header --> <rect x="226" y="112" width="370" height="48" fill="#FFFFFF" fill-opacity="0.05"/> <circle cx="250" cy="136" r="9" fill="#55D6C2"/> <rect x="270" y="130" width="112" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.72"/> <rect x="500" y="130" width="42" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.25"/> <!-- Sidebar --> <rect x="226" y="160" width="72" height="202" fill="#FFFFFF" fill-opacity="0.035"/> <rect x="242" y="181" width="40" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.65"/> <rect x="242" y="207" width="32" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.28"/> <rect x="242" y="233" width="38" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.28"/> <rect x="242" y="259" width="30" height="8" rx="4" fill="#55D6C2" fill-opacity="0.8"/> <!-- Main title --> <rect x="322" y="181" width="130" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.82"/> <rect x="322" y="203" width="92" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.28"/> <!-- Course cards --> <rect x="322" y="231" width="112" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.10"/> <rect x="448" y="231" width="112" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.10"/> <!-- Card icons --> <rect x="338" y="246" width="30" height="30" rx="8" fill="#0D5AB8"/> <path d="M347 260L353 266L362 254" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <rect x="464" y="246" width="30" height="30" rx="8" fill="#55D6C2" fill-opacity="0.85"/> <path d="M474 261H484M479 256V266" stroke="#062F63" stroke-width="3" stroke-linecap="round"/> <!-- Card text --> <rect x="338" y="286" width="64" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.52"/> <rect x="464" y="286" width="70" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.52"/> <!-- Progress bar --> <rect x="322" y="326" width="238" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.10"/> <rect x="322" y="326" width="158" height="9" rx="4.5" fill="#55D6C2"/> </g> <!-- Laptop bottom --> <path d="M182 386H638L660 418C664 425 659 432 651 432H169C161 432 156 425 160 418L182 386Z" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" /> <!-- Trackpad --> <rect x="365" y="399" width="90" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.20"/> </g> <!-- Floating achievement card --> <g filter="url(#softShadow)"> <rect x="560" y="350" width="158" height="96" rx="20" fill="#FFFFFF" fill-opacity="0.96"/> <!-- Trophy --> <circle cx="590" cy="380" r="17" fill="#0A4291"/> <path d="M584 373H596V381C596 386 593 389 590 389C587 389 584 386 584 381V373Z" fill="#FFFFFF" /> <path d="M584 376H579C579 382 582 385 586 385M596 376H601C601 382 598 385 594 385" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" /> <rect x="615" y="371" width="72" height="9" rx="4.5" fill="#0A4291"/> <rect x="615" y="388" width="55" height="7" rx="3.5" fill="#8A90AC"/> <rect x="584" y="415" width="105" height="7" rx="3.5" fill="#D6E6FF"/> <rect x="584" y="415" width="76" height="7" rx="3.5" fill="#0A4291"/> </g> <!-- Bottom decorative line --> <path d="M82 470C190 438 270 486 382 462C488 439 578 477 718 446" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2" stroke-linecap="round" /> </svg>